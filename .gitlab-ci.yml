spec:
  inputs:
    generate_docs:
      description: "Publish docs for livelink.js, livelink.agent and livelink.react (only takes effect on the default branch)"
      type: boolean
      default: false
---
# SETTINGS ############################################################################################################
include:
  - project: 3dverse/platform/ci-utils/gitlab-templates
    file:
      - /ci/.bases/_index.yaml
      - /ci/.bases/regcreds.yaml
      - /ci/.bases/node/_index.yaml

variables:
  NODE_VERSION: "24"

# RULES     ###########################################################################################################
.manual-doc-publish-rule: &manual-doc-publish-rule $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $[[ inputs.generate_docs ]] == true

.release-rule: &release-rule $CI_COMMIT_BRANCH == "release"

.default-branch-rule: &default-branch-rule $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.merge-request-on-release-rule: &merge-request-on-release-rule $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release"

# TEMPLATES ###########################################################################################################
.docs:
  stage: deploy
  extends:
    - .env-dev
    - .runner-onprem
  image: node:${NODE_VERSION}
  before_script:
    - cd $PACKAGE_DIR
    - !reference [.node-cache, before_script]
  script:
    - npm run typedoc:md
    - tar -zcvf docs-md.tgz -C docs-md/ .
    - |
      echo "Publishing $PACKAGE_DIR docs"

      echo "Package latest"
      curl \
          --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file docs-md.tgz \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/latest/docs-md.tgz"

      if [ -n "$CI_COMMIT_TAG" ]; then
          echo "Package $CI_COMMIT_TAG"
          curl \
              --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              --upload-file docs-md.tgz \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/docs-md.tgz"
      fi

# JOBS ################################################################################################################
# BUILD
js:build:libs:
  stage: build
  extends:
    - .env-dev
    - .runner-onprem
  image: node:${NODE_VERSION}
  needs:
    - job: version:update-version
      artifacts: true
      optional: true
  artifacts:
    expire_in: 1 day
    paths:
      - "*/_prebuild/"
      - "*/dist/"
      - "livelink.clients/*/_prebuild/"
      - "livelink.clients/*/dist/"
  before_script:
    - !reference [.node-cache, before_script]
  variables:
    NPM_INSTALL_ARGS: "--workspace=livelink.clients/livelink.js --workspace=livelink.clients/livelink.agent --workspace=livelink.react --workspace=livelink.react.ui --workspace=livelink.three --workspace=livelink.webxr"
  script:
    - npm run build:js
    - npm run build:agent
    - npm run build:react
    - npm run build:three
    - npm run build:react.ui
    - npm run build:webxr
  rules:
    - if: *default-branch-rule
    - if: *merge-request-on-release-rule
    - if: *release-rule

js:build:storybook:
  stage: build
  extends:
    - .env-dev
    - .runner-onprem
  image: node:${NODE_VERSION}
  needs:
    - job: js:build:libs
      artifacts: true
  artifacts:
    expire_in: 1 day
    paths:
      - "livelink.react.ui/storybook-static/"
  before_script:
    - !reference [.node-cache, before_script]
  variables:
    NPM_INSTALL_ARGS: "--workspace=livelink.react.ui"
  script:
    - npm run build-storybook
  rules:
    - if: *default-branch-rule

js:build:samples:
  stage: build
  extends:
    - .env-dev
    - .runner-onprem
  image: node:${NODE_VERSION}
  needs:
    - job: js:build:libs
      artifacts: true
  artifacts:
    expire_in: 1 day
    paths:
      - "*/dist/"
      - "livelink.clients/*/dist/"
  before_script:
    - !reference [.node-cache, before_script]
  variables:
    NPM_INSTALL_ARGS: "--workspace=livelink.samples"
  script:
    - npm run build:samples
  rules:
    - if: *default-branch-rule

# TESTS ###############################################################################################################
js:livelink.js:test:unit:
  stage: test
  extends:
    - .env-dev
    - .runner-onprem
  image: node:${NODE_VERSION}
  needs:
    - job: js:build:libs
      artifacts: true
  before_script:
    - !reference [.node-cache, before_script]
  variables:
    NPM_INSTALL_ARGS: "--workspace=livelink.clients/livelink.base --workspace=livelink.clients/livelink.js --workspace=livelink.clients/livelink.agent"
  script:
    - npm run test
  rules:
    - if: *default-branch-rule
    - if: *merge-request-on-release-rule
    - if: *release-rule

# VERSION #############################################################################################################
version:update-mr:
  stage: deploy
  extends:
    - .runner-onprem
  image: registry.gitlab.com/3dverse/platform/ci-utils/docker-images/changesets-tools:latest
  script:
    - changesets-tools generate-changesets
    - changesets-tools post-merge-request-details
  rules:
    - if: *merge-request-on-release-rule

version:update-version:
  stage: pre-build
  extends:
    - .runner-onprem
  image: registry.gitlab.com/3dverse/platform/ci-utils/docker-images/changesets-tools:latest
  artifacts:
    paths:
      - "*/package.json"
      - "*/CHANGELOG.md"
      - "livelink.clients/*/package.json"
      - "livelink.clients/*/CHANGELOG.md"
      - "./package-lock.json"
  script:
    - changesets-tools generate-changesets
    - |
      rm -f .changeset/base-release.md
      BASE_REF="${CI_COMMIT_BEFORE_SHA:-}"
      if [ -n "$BASE_REF" ] && git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
        if git diff --name-only "$BASE_REF" HEAD | grep -q '^livelink.clients/livelink.base/'; then
          printf '%s\n' \
            '---' \
            "'@3dverse/livelink': patch" \
            "'@3dverse/livelink-agent': patch" \
            '---' \
            '' \
            'Rebuild and release after livelink.base changes.' > .changeset/base-release.md
          echo "Detected livelink.base change in commit range; created fallback changeset for released packages"
        fi
      elif git diff --name-only HEAD~1 HEAD | grep -q '^livelink.clients/livelink.base/'; then
        printf '%s\n' \
          '---' \
          "'@3dverse/livelink': patch" \
          "'@3dverse/livelink-agent': patch" \
          '---' \
          '' \
          'Rebuild and release after livelink.base changes.' > .changeset/base-release.md
        echo "Detected livelink.base change in previous commit; created fallback changeset for released packages"
      fi
    - npx @changesets/cli version
    - npm i --package-lock-only
  rules:
    - if: *release-rule

version:publish:
  stage: deploy
  extends:
    - .runner-saas # OIDC trusted publishing requires a GitLab.com-hosted runner
  image: registry.gitlab.com/3dverse/platform/ci-utils/docker-images/changesets-tools:latest
  # npm OIDC trusted publishing (trusted publisher configured per package on npmjs.com)
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  needs:
    - job: js:build:libs
      artifacts: true
    - job: version:update-version
      artifacts: true
  artifacts:
    expire_in: 1 day
    paths:
      - "*/package.json"
      - "livelink.clients/*/package.json"
  before_script:
    - |
      git config --global user.name "${BOT_3DVERSE_USER_NAME}"
      git config --global user.email "${BOT_3DVERSE_USER_EMAIL}"
      git checkout -b $CI_COMMIT_REF_NAME || git checkout $CI_COMMIT_REF_NAME
      git remote set-url origin "https://${BOT_3DVERSE_USER_USERNAME}:${BOT_3DVERSE_GITLAB_API_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    # publish auth is OIDC (id_tokens), no token needed
    - npm config set @3dverse:registry="https://registry.npmjs.org" --userconfig=".npmrc"
  script:
    # Commit the changes
    - |
      git add .
      git commit -m "RELEASING: Releasing package(s)"
    # Tag the commit with the new version
    - npx @changesets/cli tag
    # Push the commit and tag
    - git push origin $CI_COMMIT_REF_NAME --follow-tags -o ci.skip || git push --set-upstream origin $CI_COMMIT_REF_NAME --follow-tags -o ci.skip
    # Publish the packages
    - npx @changesets/cli publish
    # Create a release on GitHub
    - changesets-tools create-github-release --remote-url="${GITHUB_REMOTE_URL}" --api-token="${GITHUB_API_TOKEN}"
    # Merge the release branch into the default branch
    - git fetch origin main
    - git checkout -b $CI_DEFAULT_BRANCH origin/$CI_DEFAULT_BRANCH
    - git merge --no-ff $CI_COMMIT_REF_NAME
    - git push origin $CI_DEFAULT_BRANCH
  variables:
    GIT_STRATEGY: clone
  rules:
    - if: *release-rule

# UTILS   #############################################################################################################
create-mr:
  stage: deploy
  extends:
    - .env-dev
    - .runner-onprem
  image: node:${NODE_VERSION}-alpine
  script:
    - npx tsx .ci/create-mr.mts
  rules:
    - if: *default-branch-rule

# PAGES    #############################################################################################################
pages:
  stage: deploy
  extends:
    - .env-dev
    - .runner-onprem
  needs:
    - job: js:build:samples
      artifacts: true
    - job: js:build:storybook
      artifacts: true
  artifacts:
    paths:
      - public/
  script:
    - mv -v livelink.samples/dist public
    - mv -v livelink.react.ui/storybook-static public/storybook
  rules:
    - if: *default-branch-rule

# DOCS    #############################################################################################################
js:livelink.js:docs:
  stage: deploy
  extends:
    - .docs
  needs:
    - job: js:build:libs
      artifacts: true
    - job: version:publish
      artifacts: true
      optional: true
  variables:
    PACKAGE_DIR: livelink.clients/livelink.js
    PACKAGE_NAME: livelink.js
  rules:
    - if: *release-rule
    - if: *manual-doc-publish-rule

js:livelink.agent:docs:
  stage: deploy
  extends:
    - .docs
  needs:
    - job: js:build:libs
      artifacts: true
    - job: version:publish
      artifacts: true
      optional: true
  variables:
    PACKAGE_DIR: livelink.clients/livelink.agent
    PACKAGE_NAME: livelink.agent
  rules:
    - if: *release-rule
    - if: *manual-doc-publish-rule

js:livelink.react:docs:
  stage: deploy
  extends:
    - .docs
  needs:
    - job: js:build:libs
      artifacts: true
    - job: version:publish
      artifacts: true
      optional: true
  variables:
    PACKAGE_DIR: livelink.react
    PACKAGE_NAME: livelink.react
  rules:
    - if: *release-rule
    - if: *manual-doc-publish-rule

js:livelink.js:docs-trigger:
  stage: deploy
  needs:
    - job: js:livelink.js:docs
      artifacts: false
    - job: js:livelink.react:docs
      artifacts: false
      optional: true
    - job: js:livelink.agent:docs
      artifacts: false
  variables:
    # These variables will be used in the triggered downstream pipeline to download the generated docs artifacts.
    DISABLE_DEFAULT_PIPELINES: "true"
    LIVELINK_PACKAGE_NAMES: livelink.js livelink.agent livelink.react
    LIVELINK_PACKAGE_ROOT: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/
    LIVELINK_PACKAGE_PATH: /latest/docs-md.tgz
    SYNC_LIVELINK_JS: "true"
  rules:
    - if: *release-rule
    - if: *manual-doc-publish-rule
  trigger:
    project: 3dverse/corp/3dverse-docs
    strategy: depend
