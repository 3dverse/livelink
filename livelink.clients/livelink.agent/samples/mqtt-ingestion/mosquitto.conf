# Broker configuration for the "MQTT Ingestion" sample.
#
# Two listeners on the same broker. The simulator and the sample agent both use
# the plain TCP one; the WebSocket one is there because a browser can speak MQTT
# no other way, and this sample's mappings run in a page unchanged.

listener 1883
protocol mqtt

listener 8000
protocol websockets

# A throwaway broker on your own machine: no accounts, no TLS. Do not carry this
# line over to anything reachable from outside it.
allow_anonymous true
